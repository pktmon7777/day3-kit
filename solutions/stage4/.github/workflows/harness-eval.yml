# 하네스 품질 게이트 — 시크릿·matrix·self-hosted runner 없음.
# LLM 호출은 로컬에서(py kit.py record) 하고 결과를 커밋한다.
# CI 는 '현재 하네스로 측정한 결과가 있는가' + '기준을 넘는가' 만 판정한다.
name: harness-eval
on:
  pull_request:
    paths: ['harness/**', 'evals/**', 'results/**']
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python kit.py ci
